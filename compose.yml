# Local stack: API + Postgres + Redis (+ optional Ollama).
#   cp .env.example .env
#   docker compose up --build            # API on http://localhost:8000/docs
#   docker compose --profile llm up -d ollama && docker compose exec ollama ollama pull llama3.1:8b
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      # Inside the compose network, services reach each other by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://adlens:adlens@db:5432/adlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: adlens
      POSTGRES_PASSWORD: adlens   # local only; real envs use a secrets manager
      POSTGRES_DB: adlens
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adlens -d adlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama
    profiles: ["llm"]   # only starts with --profile llm
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata: {}
  ollama: {}
